<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家計簿</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1e2530;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --text: #e6edf3;
    --text2: #8b949e;
    --border: #30363d;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .header-month {
    font-size: 13px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .month-nav {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .month-nav:hover { background: var(--surface2); }

  nav {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
    color: var(--text2);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { flex: 1; overflow-y: auto; }
  .page { display: none; padding: 14px 16px 80px; }
  .page.active { display: block; }

  /* ===== BALANCE BAR ===== */
  .balance-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: flex;
    gap: 12px;
  }
  .balance-item { flex: 1; text-align: center; }
  .balance-val { font-size: 20px; font-weight: 800; }
  .balance-lbl { font-size: 10px; color: var(--text2); margin-top: 2px; }
  .bal-income { color: var(--green); }
  .bal-expense { color: var(--red); }
  .bal-total { color: var(--accent); }
  .balance-divider { width: 1px; background: var(--border); }

  /* ===== INPUT FORM ===== */
  .type-toggle {
    display: flex;
    background: var(--surface2);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 14px;
    gap: 4px;
  }
  .type-toggle-btn {
    flex: 1;
    padding: 10px;
    border-radius: 9px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: none;
    color: var(--text2);
    transition: all 0.15s;
  }
  .type-toggle-btn.active-income { background: var(--green); color: #fff; }
  .type-toggle-btn.active-expense { background: var(--red); color: #fff; }

  .form-section { margin-bottom: 14px; }
  .form-label {
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .amount-input-wrap { position: relative; }
  .amount-prefix {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    font-weight: 700;
    color: var(--text2);
  }
  .amount-input {
    width: 100%;
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--text);
    font-size: 28px;
    font-weight: 800;
    padding: 12px 14px 12px 36px;
    border-radius: 12px;
    outline: none;
    -webkit-appearance: none;
  }
  .amount-input:focus { border-color: var(--accent); }

  .category-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .cat-btn {
    padding: 9px 6px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .cat-btn .cat-icon { font-size: 18px; display: block; margin-bottom: 2px; }
  .cat-btn.sel-income { border-color: var(--green); background: rgba(63,185,80,0.12); color: var(--green); }
  .cat-btn.sel-expense { border-color: var(--red); background: rgba(248,81,73,0.12); color: var(--red); }

  .date-input, .memo-input {
    width: 100%;
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--text);
    font-size: 15px;
    padding: 11px 14px;
    border-radius: 12px;
    outline: none;
    -webkit-appearance: none;
  }
  .date-input:focus, .memo-input:focus { border-color: var(--accent); }
  .memo-input { font-family: inherit; resize: none; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    transition: opacity 0.1s, transform 0.1s;
    margin-top: 6px;
  }
  .submit-btn:active { opacity: 0.75; transform: scale(0.98); }
  .submit-btn.income-mode { background: var(--green); }
  .submit-btn.expense-mode { background: var(--red); }

  /* ===== HISTORY ===== */
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .record-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .record-icon-wrap {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .record-icon-wrap.income { background: rgba(63,185,80,0.15); }
  .record-icon-wrap.expense { background: rgba(248,81,73,0.15); }
  .record-info { flex: 1; min-width: 0; }
  .record-cat { font-size: 13px; font-weight: 700; }
  .record-memo { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .record-date { font-size: 11px; color: var(--text2); }
  .record-amount { font-size: 17px; font-weight: 800; flex-shrink: 0; }
  .record-amount.income { color: var(--green); }
  .record-amount.expense { color: var(--red); }
  .record-delete {
    background: none;
    border: none;
    color: var(--text2);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .record-delete:hover { color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
    font-size: 14px;
  }

  /* ===== SUMMARY ===== */
  .summary-section { margin-bottom: 20px; }
  .section-title {
    font-size: 12px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }

  .cat-summary-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .cat-summary-icon { font-size: 18px; width: 24px; text-align: center; }
  .cat-summary-info { flex: 1; min-width: 0; }
  .cat-summary-name { font-size: 13px; font-weight: 600; }
  .cat-summary-bar-wrap {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin-top: 4px;
  }
  .cat-summary-bar { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .cat-summary-bar.income { background: var(--green); }
  .cat-summary-bar.expense { background: var(--red); }
  .cat-summary-amount { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .cat-summary-amount.income { color: var(--green); }
  .cat-summary-amount.expense { color: var(--red); }

  .monthly-chart {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 120px;
    margin-bottom: 6px;
  }
  .month-bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .month-bars { display: flex; gap: 2px; align-items: flex-end; height: 100px; }
  .month-bar {
    width: 14px;
    border-radius: 3px 3px 0 0;
    min-height: 2px;
    transition: height 0.3s;
  }
  .month-bar.income { background: var(--green); }
  .month-bar.expense { background: var(--red); }
  .month-label { font-size: 9px; color: var(--text2); }

  /* ===== TUTORIAL ===== */
  .tutorial-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88);
    z-index: 300; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .tutorial-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%; max-width: 420px;
    padding: 28px 24px 24px;
    position: relative;
  }
  .tutorial-step-dots {
    display: flex; justify-content: center; gap: 6px; margin-bottom: 24px;
  }
  .tutorial-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--border); transition: background 0.2s, width 0.2s;
  }
  .tutorial-dot.active { background: var(--accent); width: 20px; border-radius: 4px; }
  .tutorial-icon { font-size: 52px; text-align: center; margin-bottom: 16px; }
  .tutorial-title { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 10px; }
  .tutorial-body { font-size: 14px; color: var(--text2); line-height: 1.7; margin-bottom: 20px; text-align: center; }
  .tutorial-body b { color: var(--text); }
  .tutorial-tip {
    background: var(--surface2); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; color: var(--text2);
    line-height: 1.6; margin-bottom: 20px; text-align: left;
  }
  .tutorial-tip b { color: var(--accent); }
  .tutorial-actions { display: flex; gap: 8px; }
  .tutorial-skip {
    flex: 0; padding: 13px 16px; border-radius: 12px;
    border: 1px solid var(--border); background: none;
    color: var(--text2); font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .tutorial-next {
    flex: 1; padding: 14px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; font-size: 15px;
    font-weight: 700; cursor: pointer; transition: opacity 0.1s;
  }
  .tutorial-next:active { opacity: 0.75; }
  .tutorial-next.last { background: var(--green); }
  .help-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text2); border-radius: 50%;
    width: 30px; height: 30px; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .help-btn:hover { background: var(--surface2); color: var(--text); }

  /* ===== IMPORT MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 200; display: flex; align-items: flex-end;
  }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px; margin: 0 auto;
    max-height: 92vh; display: flex; flex-direction: column;
    border: 1px solid var(--border); border-bottom: none;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-close {
    background: var(--surface2); border: none; color: var(--text2);
    border-radius: 50%; width: 30px; height: 30px; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modal-body { flex: 1; overflow-y: auto; padding: 16px 18px 24px; }

  .dropzone {
    border: 2px dashed var(--border); border-radius: 14px;
    padding: 40px 20px; text-align: center; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 14px;
  }
  .dropzone:hover, .dropzone.drag-over { border-color: var(--accent); background: rgba(88,166,255,0.06); }
  .dropzone-icon { font-size: 40px; margin-bottom: 10px; }
  .dropzone-text { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .dropzone-sub { font-size: 12px; color: var(--text2); }

  .import-hint {
    background: var(--surface2); border-radius: 10px;
    padding: 12px 14px; font-size: 12px; color: var(--text2); line-height: 1.6;
  }
  .import-hint b { color: var(--text); }

  .import-summary {
    background: var(--surface2); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 12px;
    font-size: 13px; display: flex; gap: 16px;
  }
  .import-summary span { color: var(--text2); }
  .import-summary b { color: var(--text); }

  .import-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 14px; }
  .import-table th {
    text-align: left; padding: 6px 8px; color: var(--text2);
    border-bottom: 1px solid var(--border); font-weight: 600; font-size: 11px;
  }
  .import-table td { padding: 7px 8px; border-bottom: 1px solid rgba(48,54,61,0.5); vertical-align: middle; }
  .import-table tr:hover td { background: var(--surface2); }
  .import-table .td-date { color: var(--text2); white-space: nowrap; }
  .import-table .td-desc { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .import-table .td-amt-in { color: var(--green); font-weight: 700; text-align: right; white-space: nowrap; }
  .import-table .td-amt-out { color: var(--red); font-weight: 700; text-align: right; white-space: nowrap; }
  .import-table select {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-size: 11px; border-radius: 6px;
    padding: 3px 5px; width: 100%; outline: none;
  }
  .import-table .skip-row td { opacity: 0.35; }
  .td-skip input { accent-color: var(--accent); cursor: pointer; }

  .import-btn {
    width: 100%; padding: 15px; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 700; color: #fff;
    background: var(--accent); cursor: pointer;
    transition: opacity 0.1s;
  }
  .import-btn:active { opacity: 0.75; }
  .icon-btn-import {
    background: rgba(88,166,255,0.12); border: 1px solid var(--accent);
    color: var(--accent); border-radius: 8px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <div class="logo">💰 家計簿</div>
  <div style="display:flex;gap:6px;align-items:center">
  <button class="help-btn" onclick="openTutorial()" title="使い方">?</button>
  <button class="icon-btn-import" onclick="openImport()">↑ OLIVE</button>
  </div>
  <div class="header-month">
    <button class="month-nav" onclick="prevMonth()">‹</button>
    <span id="headerMonth"></span>
    <button class="month-nav" onclick="nextMonth()">›</button>
  </div>
</header>

<nav>
  <div class="tab active" id="tab-input" onclick="showPage('page-input','tab-input')">入力</div>
  <div class="tab" id="tab-history" onclick="showPage('page-history','tab-history')">一覧</div>
  <div class="tab" id="tab-summary" onclick="showPage('page-summary','tab-summary')">集計</div>
</nav>

<main>
  <!-- INPUT PAGE -->
  <div id="page-input" class="page active">
    <div class="type-toggle">
      <button class="type-toggle-btn active-income" id="btn-income" onclick="setType('income')">＋ 収入</button>
      <button class="type-toggle-btn" id="btn-expense" onclick="setType('expense')">－ 支出</button>
    </div>

    <div class="form-section">
      <div class="form-label">金額</div>
      <div class="amount-input-wrap">
        <span class="amount-prefix">¥</span>
        <input class="amount-input" id="amountInput" type="number" inputmode="numeric" placeholder="0" min="0">
      </div>
    </div>

    <div class="form-section">
      <div class="form-label">カテゴリ</div>
      <div class="category-grid" id="categoryGrid"></div>
    </div>

    <div class="form-section">
      <div class="form-label">日付</div>
      <input class="date-input" id="dateInput" type="date">
    </div>

    <div class="form-section">
      <div class="form-label">メモ（任意）</div>
      <textarea class="memo-input" id="memoInput" rows="2" placeholder="メモを入力..."></textarea>
    </div>

    <button class="submit-btn income-mode" id="submitBtn" onclick="addRecord()">追加する</button>
  </div>

  <!-- HISTORY PAGE -->
  <div id="page-history" class="page">
    <div class="balance-bar" id="historyBalance"></div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- SUMMARY PAGE -->
  <div id="page-summary" class="page">
    <div class="balance-bar" id="summaryBalance"></div>

    <div class="summary-section" id="summaryExpense"></div>
    <div class="summary-section" id="summaryIncome"></div>
    <div class="summary-section" id="summaryPoker"></div>

    <div class="summary-section">
      <div class="section-title">過去6ヶ月</div>
      <div class="monthly-chart" id="monthlyChart"></div>
    </div>
  </div>
</main>

<script>
const CATEGORIES = {
  income: [
    { id: 'salary',     label: '給与',      icon: '💼' },
    { id: 'poker_win',  label: 'ポーカー勝', icon: '🃏' },
    { id: 'side',       label: '副収入',    icon: '💻' },
    { id: 'gift',       label: 'お小遣い',  icon: '🎁' },
    { id: 'invest',     label: '投資',      icon: '📈' },
    { id: 'refund',     label: '払戻',      icon: '🔄' },
    { id: 'other_in',   label: 'その他',    icon: '💰' },
  ],
  expense: [
    { id: 'food',       label: '食費',      icon: '🍜' },
    { id: 'snack',      label: 'お菓子',    icon: '🍬' },
    { id: 'clothing',   label: '洋服',      icon: '👕' },
    { id: 'poker_lose', label: 'ポーカー負', icon: '🃏' },
    { id: 'transport',  label: '交通費',    icon: '🚃' },
    { id: 'housing',    label: '住居費',    icon: '🏠' },
    { id: 'utility',    label: '光熱費',    icon: '💡' },
    { id: 'medical',    label: '医療',      icon: '🏥' },
    { id: 'daily',      label: '日用品',    icon: '🛒' },
    { id: 'enjoy',      label: '娯楽',      icon: '🎮' },
    { id: 'other_ex',   label: 'その他',    icon: '📦' },
  ]
};

const CAT_MAP = {};
[...CATEGORIES.income, ...CATEGORIES.expense].forEach(c => CAT_MAP[c.id] = c);

let records = JSON.parse(localStorage.getItem('kakeibo_v1') || '[]');
let currentType = 'income';
let selectedCat = 'salary';
let currentMonth = (() => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
})();

function saveRecords() { localStorage.setItem('kakeibo_v1', JSON.stringify(records)); }

function prevMonth() {
  const [y, m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  renderAll();
}
function nextMonth() {
  const [y, m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m, 1);
  currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  renderAll();
}

function fmtMonth(ym) {
  const [y, m] = ym.split('-');
  return `${y}年${Number(m)}月`;
}

function fmtAmt(n) {
  return '¥' + n.toLocaleString('ja-JP');
}

function setType(type) {
  currentType = type;
  document.getElementById('btn-income').className = 'type-toggle-btn' + (type === 'income' ? ' active-income' : '');
  document.getElementById('btn-expense').className = 'type-toggle-btn' + (type === 'expense' ? ' active-expense' : '');
  const firstCat = CATEGORIES[type][0].id;
  selectedCat = firstCat;
  renderCategoryGrid();
  document.getElementById('submitBtn').className = `submit-btn ${type}-mode`;
}

function renderCategoryGrid() {
  const cats = CATEGORIES[currentType];
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = cats.map(c => `
    <button class="cat-btn${selectedCat === c.id ? ' sel-' + currentType : ''}" onclick="selectCat('${c.id}')">
      <span class="cat-icon">${c.icon}</span>${c.label}
    </button>
  `).join('');
}

function selectCat(id) {
  selectedCat = id;
  renderCategoryGrid();
}

function addRecord() {
  const amt = parseInt(document.getElementById('amountInput').value, 10);
  if (!amt || amt <= 0) { showFlash('金額を入力してください'); return; }
  const date = document.getElementById('dateInput').value;
  if (!date) { showFlash('日付を選択してください'); return; }

  const rec = {
    id: Date.now(),
    type: currentType,
    category: selectedCat,
    amount: amt,
    date,
    memo: document.getElementById('memoInput').value.trim()
  };
  records.unshift(rec);
  saveRecords();

  document.getElementById('amountInput').value = '';
  document.getElementById('memoInput').value = '';
  showFlash('追加しました ✓');
  renderAll();
}

function deleteRecord(id) {
  if (!confirm('削除しますか？')) return;
  records = records.filter(r => r.id !== id);
  saveRecords();
  renderAll();
}

function monthRecords(ym) {
  return records.filter(r => r.date.startsWith(ym));
}

function calcBalance(recs) {
  let income = 0, expense = 0;
  recs.forEach(r => r.type === 'income' ? (income += r.amount) : (expense += r.amount));
  return { income, expense, balance: income - expense };
}

function renderBalanceBar(el, ym) {
  const { income, expense, balance } = calcBalance(monthRecords(ym));
  const sign = balance >= 0 ? '+' : '';
  el.innerHTML = `
    <div class="balance-item">
      <div class="balance-val bal-income">${fmtAmt(income)}</div>
      <div class="balance-lbl">収入</div>
    </div>
    <div class="balance-divider"></div>
    <div class="balance-item">
      <div class="balance-val bal-expense">${fmtAmt(expense)}</div>
      <div class="balance-lbl">支出</div>
    </div>
    <div class="balance-divider"></div>
    <div class="balance-item">
      <div class="balance-val bal-total" style="color:${balance >= 0 ? 'var(--green)' : 'var(--red)'}">${sign}${fmtAmt(balance)}</div>
      <div class="balance-lbl">収支</div>
    </div>
  `;
}

function renderHistory() {
  const recs = monthRecords(currentMonth).sort((a, b) => b.date.localeCompare(a.date));
  renderBalanceBar(document.getElementById('historyBalance'), currentMonth);

  const list = document.getElementById('historyList');
  if (recs.length === 0) {
    list.innerHTML = '<div class="empty-state">この月の記録はありません</div>';
    return;
  }

  list.innerHTML = recs.map(r => {
    const cat = CAT_MAP[r.category] || { label: r.category, icon: '?' };
    const d = r.date.split('-');
    const dateStr = `${Number(d[1])}/${Number(d[2])}`;
    return `<div class="record-card">
      <div class="record-icon-wrap ${r.type}"><span>${cat.icon}</span></div>
      <div class="record-info">
        <div class="record-cat">${cat.label}</div>

      <button class="record-delete" onclick="deleteRecord(${r.id})">🗑</button>
    </div>`;
  }).join('');
}

function renderSummary() {
  renderBalanceBar(document.getElementById('summaryBalance'), currentMonth);

  const recs = monthRecords(currentMonth);

  // Category breakdown
  function renderCatSection(type, el, title) {
    const filtered = recs.filter(r => r.type === type);
    const total = filtered.reduce((s, r) => s + r.amount, 0);
    const bycat = {};
    filtered.forEach(r => { bycat[r.category] = (bycat[r.category] || 0) + r.amount; });
    const sorted = Object.entries(bycat).sort((a, b) => b[1] - a[1]);

    if (sorted.length === 0) { el.innerHTML = ''; return; }

    const rows = sorted.map(([id, amt]) => {
      const cat = CAT_MAP[id] || { label: id, icon: '?' };
      const pct = total > 0 ? (amt / total * 100).toFixed(0) : 0;
      return `<div class="cat-summary-row">
        <div class="cat-summary-icon">${cat.icon}</div>
        <div class="cat-summary-info">
          <div class="cat-summary-name">${cat.label}</div>
          <div class="cat-summary-bar-wrap">
            <div class="cat-summary-bar ${type}" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="cat-summary-amount ${type}">${fmtAmt(amt)}</div>
      </div>`;
    }).join('');

    el.innerHTML = `<div class="section-title">${title}</div>${rows}`;
  }

  renderCatSection('expense', document.getElementById('summaryExpense'), '支出カテゴリ');
  renderCatSection('income', document.getElementById('summaryIncome'), '収入カテゴリ');

  // Poker summary
  const pokerEl = document.getElementById('summaryPoker');
  const pokerWin = recs.filter(r => r.category === 'poker_win').reduce((s, r) => s + r.amount, 0);
  const pokerLose = recs.filter(r => r.category === 'poker_lose').reduce((s, r) => s + r.amount, 0);
  const pokerNet = pokerWin - pokerLose;
  if (pokerWin > 0 || pokerLose > 0) {
    const netColor = pokerNet >= 0 ? 'var(--green)' : 'var(--red)';
    const netSign = pokerNet >= 0 ? '+' : '';
    pokerEl.innerHTML = `<div class="section-title">🃏 ポーカー収支</div>
      <div class="balance-bar" style="margin-bottom:0">
        <div class="balance-item"><div class="balance-val bal-income">${fmtAmt(pokerWin)}</div><div class="balance-lbl">勝ち</div></div>
        <div class="balance-divider"></div>
        <div class="balance-item"><div class="balance-val bal-expense">${fmtAmt(pokerLose)}</div><div class="balance-lbl">負け</div></div>
        <div class="balance-divider"></div>
        <div class="balance-item"><div class="balance-val" style="color:${netColor};font-size:20px;font-weight:800">${netSign}${fmtAmt(pokerNet)}</div><div class="balance-lbl">収支</div></div>
      </div>`;
  } else {
    pokerEl.innerHTML = '';
  }

  // Monthly chart (past 6 months)
  const months = [];
  const [cy, cm] = currentMonth.split('-').map(Number);
  for (let i = 5; i >= 0; i--) {
    const d = new Date(cy, cm - 1 - i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }

  const maxVal = months.reduce((mx, ym) => {
    const { income, expense } = calcBalance(monthRecords(ym));
    return Math.max(mx, income, expense);
  }, 1);

  const chart = document.getElementById('monthlyChart');
  chart.innerHTML = months.map(ym => {
    const { income, expense } = calcBalance(monthRecords(ym));
    const ih = Math.round(income / maxVal * 100);
    const eh = Math.round(expense / maxVal * 100);
    const label = ym.split('-')[1] + '月';
    return `<div class="month-bar-group">
      <div class="month-bars">
        <div class="month-bar income" style="height:${ih}px"></div>
        <div class="month-bar expense" style="height:${eh}px"></div>
      </div>
      <div class="month-label">${label}</div>
    </div>`;
  }).join('');
}

let importRows = [];

function openImport() {
  document.getElementById('importModal').style.display = 'flex';

function closeImport() { document.getElementById('importModal').style.display = 'none'; }
function overlayClose(e) { if (e.target === document.getElementById('importModal')) closeImport(); }

function handleCSVFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    let text = e.target.result;
    // Try Shift-JIS decode if result looks garbled (non-UTF8 safe check)
    if (/�/.test(text)) {
      const r2 = new FileReader();
      r2.onload = e2 => parseAndPreview(e2.target.result);
      r2.readAsText(file, 'Shift_JIS');
      return;
    }
    parseAndPreview(text);
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  result.push(cur.trim());
  return result;
}

function cleanNum(s) {
  if (!s) return 0;
  return parseInt(s.replace(/[,，\s]/g, ''), 10) || 0;
}

function parseDate(s) {
  // Accept YYYY/MM/DD, YYYY-MM-DD, YYYY.MM.DD
  const m = s.replace(/[.．]/g, '/').match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (!m) return null;
  return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
}

function detectFormat(headers) {
  const h = headers.join(',');
  // Credit card format
  if (/ご利用日|利用日/.test(h)) return 'card';
  // Bank format
  if (/取引日|お取引/.test(h)) return 'bank';
  // Generic fallback: guess by column count
  return headers.length >= 4 ? 'bank' : 'unknown';
}

function parseAndPreview(text) {
  // Normalize line endings and remove BOM
  const lines = text.replace(/^﻿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim());
  if (lines.length < 2) { showFlash('データが見つかりません'); return; }

  const headers = parseCSVLine(lines[0]);
  const fmt = detectFormat(headers);
  importRows = [];

  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (cols.every(c => !c)) continue;

    let date, desc, debit = 0, credit = 0;

    if (fmt === 'card') {
      // ご利用日, ご利用店名等, ご利用者, 支払区分, ご利用金額(円), ...
      date  = parseDate(cols[0]);
      desc  = cols[1] || '';
      debit = cleanNum(cols[4] || cols[5] || '');
    } else {
      // お取引日, お取引内容, お支払い金額, お預かり金額, 差引残高
      date   = parseDate(cols[0]);
      desc   = cols[1] || '';
      debit  = cleanNum(cols[2]);
      credit = cleanNum(cols[3]);
    }

    if (!date) continue;
    // Skip rows with no amount
    if (!debit && !credit) continue;

    // Normalize full-width chars in description
    desc = desc.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();

    if (credit > 0) {
      importRows.push({ date, desc, type: 'income', amount: credit, cat: guessCategory(desc, 'income'), skip: false });
    }
    if (debit > 0) {
      importRows.push({ date, desc, type: 'expense', amount: debit, cat: guessCategory(desc, 'expense'), skip: false });
    }
  }

  if (importRows.length === 0) { showFlash('取り込めるデータがありませんでした'); return; }

  renderImportPreview();
  document.getElementById('importStep1').style.display = 'none';
  document.getElementById('importStep2').style.display = 'block';
}

  const incomeCount = importRows.filter(r => !r.skip && r.type === 'income').length;
  const expenseCount = importRows.filter(r => !r.skip && r.type === 'expense').length;

    `<div><span>合計 </span><b>${importRows.length}件</b></div>

     <div><span>支出 </span><b style="color:var(--red)">${expenseCount}件</b></div>`;

  const catOptions = allCats.map(c => `<option value="${c.id}">${c.icon} ${c.label}</option>`).join('');

  const rows = importRows.map((r, i) => {

function toggleSkip(i, checked) {
  importRows[i].skip = !checked;
  document.getElementById(`irow-${i}`).className = checked ? '' : 'skip-row';
  renderImportSummaryBar();
}

function setImportCat(i, val) { importRows[i].cat = val; }

  const inc = importRows.filter(r => !r.skip && r.type === 'income').length;
  const exp = importRows.filter(r => !r.skip && r.type === 'expense').length;

}

function executeImport() {
  const toAdd = importRows.filter(r => !r.skip);
  if (toAdd.length === 0) { showFlash('インポートする項目がありません'); return; }

  const existing = new Set(records.map(r => `${r.date}|${r.amount}|${r.type}`));
  let added = 0, skipped = 0;

  toAdd.forEach(r => {
    const key = `${r.date}|${r.amount}|${r.type}`;
    if (existing.has(key)) { skipped++; return; }
    records.push({ id: Date.now() + added, type: r.type, category: r.cat, amount: r.amount, date: r.date, memo: r.desc });
    existing.add(key);
    added++;
  });

  // Sort records by date desc
  records.sort((a, b) => b.date.localeCompare(a.date));
  saveRecords();
  renderAll();
  closeImport();
  showFlash(`${added}件インポート完了${skipped > 0 ? `（重複${skipped}件スキップ）` : ''} ✓`);
}

// Init
(function init() {
  const today = new Date();
  document.getElementById('dateInput').value =
    `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  renderCategoryGrid();
  renderAll();
  if (!localStorage.getItem('kakeibo_tutorial_done')) openTutorial(0);
})();
</script>
<!-- TUTORIAL -->
<div id="tutorialOverlay" class="tutorial-overlay" style="display:none">
  <div class="tutorial-card" id="tutorialCard"></div>
</div>

<!-- IMPORT MODAL -->
<div id="importModal" class="modal-overlay" style="display:none" onclick="overlayClose(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📥 OLIVEからインポート</div>
      <button class="modal-close" onclick="closeImport()">✕</button>
    </div>
    <div class="modal-body">
      <div id="importStep1">
        <div class="dropzone" id="dropzone"
          onclick="document.getElementById('csvFile').click()"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="event.preventDefault();this.classList.remove('drag-over');handleCSVFile(event.dataTransfer.files[0])">
          <div class="dropzone-icon">📂</div>
          <div class="dropzone-text">CSVファイルを選択またはドロップ</div>
          <div class="dropzone-sub">SMBC / OLIVEからエクスポートしたCSV</div>
        </div>
        <input type="file" id="csvFile" accept=".csv,.CSV" style="display:none" onchange="handleCSVFile(this.files[0])">
        <div class="import-hint">
          <b>CSVの取得方法</b><br>
          ① SMBCダイレクト → 入出金明細 → CSV出力<br>
          ② OLIVEアプリ → 明細 → ダウンロード<br>
          ③ 三井住友カード → 利用明細 → CSVダウンロード<br><br>
          <b>対応フォーマット</b>：銀行口座明細・クレジットカード明細
        </div>
      </div>
      <div id="importStep2" style="display:none">
        <div class="import-summary" id="importSummaryBar"></div>
        <div style="overflow-x:auto">
          <table class="import-table" id="importTableEl"></table>
        </div>
        <button class="import-btn" onclick="executeImport()">インポートする</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
